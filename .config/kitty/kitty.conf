# kitty configuration by De Denkwegweiser
# Minimal, aesthetic setup for KDE Plasma on Fedora Asahi.
# Reload with Ctrl+Shift+F5. Docs: https://sw.kovidgoyal.net/kitty/conf/

# --- Font --------------------------------------------------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Cursor ------------------------------------------------------------------

cursor_shape               block
cursor_beam_thickness      3.0
cursor_underline_thickness 3.0
cursor_blink_interval      -1
cursor_stop_blinking_after 10.0

# --- Scrollback --------------------------------------------------------------

scrollback_lines              10000
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_fill_enlarged_window no
wheel_scroll_multiplier       5.0
wheel_scroll_min_lines        1
touch_scroll_multiplier       1.0

# --- Mouse -------------------------------------------------------------------

mouse_hide_wait             3.0
url_style                   dashed
copy_on_select              clipboard
focus_follows_mouse         no
default_pointer_shape       beam
pointer_shape_when_grabbed  arrow
pointer_shape_when_dragging beam

# --- Performance -------------------------------------------------------------

repaint_delay   10
input_delay     3
sync_to_monitor yes

# --- Bell --------------------------------------------------------------------

enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# --- Window ------------------------------------------------------------------

remember_window_size    no
initial_window_width    900
initial_window_height   556
window_border_width     0.0pt
draw_minimal_borders    yes
window_margin_width     0
window_padding_width    0
placement_strategy      center
inactive_text_alpha     0.8
# Keep the KDE title bar
hide_window_decorations no
confirm_os_window_close -1
wayland_titlebar_color  system

# Translucent background; KWin blurs what is behind it
background_opacity         0.6
background_blur            100
dynamic_background_opacity no
dim_opacity                0.4

# --- Tab bar -----------------------------------------------------------------

tab_bar_edge                bottom
tab_bar_style               fade
tab_fade                    1
tab_bar_align               left
tab_bar_min_tabs            1
tab_switch_strategy         previous
active_tab_title_template   "{title} 🌸"
tab_title_template          "{title}"

# --- Behaviour ---------------------------------------------------------------

editor                nvim
shell_integration     enabled
close_on_child_death  no
allow_remote_control  no
allow_hyperlinks      yes
allow_cloning         ask
update_check_interval 0
clipboard_control     write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size    512

# --- Colors: Tokyo Night (same palette as Neovim and tmux) --------------------

include themes/tokyonight_night.conf

# --- Keyboard ----------------------------------------------------------------
# kitty owns Ctrl+T/W/V/Q/C here; Neovim and tmux use other keys for those
# actions (see the README).

# Tabs
map ctrl+t           new_tab
map ctrl+w           close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+page_down   next_tab
map ctrl+page_up     previous_tab
map kitty_mod+.      move_tab_forward
map kitty_mod+,      move_tab_backward
map kitty_mod+alt+t  set_tab_title

# Window
map ctrl+q           close_os_window
map ctrl+shift+f     toggle_fullscreen
map ctrl+shift+r     start_resizing_window

# Clipboard: Ctrl+C copies when text is selected, otherwise interrupts
map ctrl+c           copy_and_clear_or_interrupt
map ctrl+v           paste_from_clipboard
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard

# Scrolling (Shift+PageUp/PageDown so PageUp/PageDown still reach programs)
map kitty_mod+up     scroll_line_up
map kitty_mod+down   scroll_line_down
map shift+page_up    scroll_page_up
map shift+page_down  scroll_page_down
map kitty_mod+home   scroll_home
map kitty_mod+end    scroll_end
map kitty_mod+z      scroll_to_prompt -1
map kitty_mod+x      scroll_to_prompt 1
map kitty_mod+h      show_scrollback
map kitty_mod+g      show_last_command_output
map ctrl+shift+x     clear_terminal reset active

# Font size
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0

# Config
map kitty_mod+escape kitty_shell window
map kitty_mod+f5     load_config_file
