# Settings, keybinds and theme, loaded in file-name order
source-file ~/.config/tmux/configs.d/*.conf

# --- Plugins (installed by TPM: scripts/packages.sh or update.sh) -------------

set -g @plugin 'tmux-plugins/tpm'

# Ctrl+h/j/k/l across tmux panes and Neovim splits (no Ctrl+\ binding).
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_prev ''

# Shows PREFIX or COPY in the status bar (styled by the theme)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_show_copy_mode 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
