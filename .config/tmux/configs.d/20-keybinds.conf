# Prefix is the default Ctrl+b.
# Ctrl+h/j/k/l move between tmux panes and Neovim splits (vim-tmux-navigator,
# set up in tmux.conf). Press prefix Ctrl+l to clear the screen.

# --- Splits and windows (open in the current directory) -----------------------

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Panes -------------------------------------------------------------------

# Move with Alt+arrows, no prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize with prefix + H/J/K/L; keep pressing to repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5

bind z resize-pane -Z
bind x kill-pane
bind X kill-window
bind < swap-pane -U
bind > swap-pane -D
bind space next-layout

# --- Sessions ----------------------------------------------------------------

bind S new-session
bind s choose-session

# --- Copy mode (vi keys) -----------------------------------------------------

bind [ copy-mode
bind ] paste-buffer
bind b list-buffers
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Tools -------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
# LazyGit in a floating popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
