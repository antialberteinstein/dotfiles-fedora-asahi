# --- Terminal ----------------------------------------------------------------

set -g default-terminal "tmux-256color"
# True color, undercurl and colored underlines in kitty (used by Neovim)
set -as terminal-features ",xterm-kitty:RGB:usstyle"
# Copy to the system clipboard through kitty (OSC 52)
set -g set-clipboard on
# Let Neovim notice when you switch back to it (gitsigns, autoread)
set -g focus-events on
# Short delay after Esc so Neovim mode switches feel instant
set -sg escape-time 10

# --- Behaviour ---------------------------------------------------------------

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g clock-mode-style 24

# Window names follow the running program (fish, nvim, lazygit...);
# programs themselves may not rename windows.
setw -g automatic-rename on
setw -g allow-rename off

# Show each pane's number and program on its top border
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# --- Messages and status -----------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g display-time 1000
set -g display-panes-time 3000

# --- Bell and activity -------------------------------------------------------

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
